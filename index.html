    <script>
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && e.reason.message ? String(e.reason.message) : '';
        if (msg.indexOf('storage') > -1 || msg.indexOf('Storage') > -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function(e) {
        var msg = e.message ? String(e.message) : '';
        if (msg.indexOf('storage') > -1 || msg.indexOf('Storage') > -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      (function() {
        'use strict';

        function MemStorage() {
          var d = {};
          this.getItem = function(k) { return d[k] || null; };
          this.setItem = function(k, v) { d[k] = String(v); };
          this.removeItem = function(k) { delete d[k]; };
          this.clear = function() { d = {}; };
          this.key = function(i) { return Object.keys(d)[i] || null; };
          Object.defineProperty(this, 'length', { get: function() { return Object.keys(d).length; }});
        }

        function isStorageAvailable(storageType) {
          try {
            var storage = window[storageType];
            var test = '__storage_test__';
            storage.setItem(test, test);
            storage.removeItem(test);
            return true;
          } catch(e) {
            return false;
          }
        }

        function createHybridStorage(storageType) {
          var canUseNative = isStorageAvailable(storageType);
          if (canUseNative) {
            return window[storageType];
          } else {
            return new MemStorage();
          }
        }

        try {
          Object.defineProperty(window, 'localStorage', {
            value: createHybridStorage('localStorage'),
            configurable: true,
            enumerable: true,
            writable: false
          });
        } catch(e) { window.localStorage = createHybridStorage('localStorage'); }

        try {
          Object.defineProperty(window, 'sessionStorage', {
            value: createHybridStorage('sessionStorage'),
            configurable: true,
            enumerable: true,
            writable: false
          });
        } catch(e) { window.sessionStorage = createHybridStorage('sessionStorage'); }
      })();
    </script>

    <script>
      (function() {
        var API_URL = 'https://admin.emmanuellek.com/api';
        var path = window.location.pathname;
        var outfitSlug = path.startsWith('/outfits/') ? path.split('/outfits/')[1] : null;

        function getCachedData(key) {
          try {
            var cached = sessionStorage.getItem(key);
            if (cached) {
              var parsed = JSON.parse(cached);
              if (parsed.data && (Date.now() - parsed.timestamp) < 30 * 60 * 1000) {
                return parsed.data;
              }
            }
          } catch(e) {}
          return null;
        }

        function shouldRefresh(key) {
          try {
            var cached = sessionStorage.getItem(key);
            if (!cached) return true;
            return (Date.now() - JSON.parse(cached).timestamp) > 5 * 60 * 1000;
          } catch(e) { return true; }
        }

        window.__renderOutfitPage = function(outfit, isLightMode) {
          if (!outfit) return;
          if (window.__outfitRendered && !isLightMode) return;
          window.__outfitRendered = true;

          var container = document.getElementById('outfit-skeleton');
          if (!container) return;

          var loader = document.getElementById('initial-loader');
          if (loader) loader.style.display = 'none';

          var placeholder = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"%3E%3Crect fill="%23f0f0f0" width="300" height="400"/%3E%3C/svg%3E';

          var productsHtml = '';
          var products = outfit.products || [];
          products.slice(0, 6).forEach(function(p) {
            var link = p.link || '#';
            var img = p.image || p.imageUrl || placeholder;
            var brand = p.brand || '';
            var name = p.name || '';
            var price = p.price ? (p.price + '€') : '';
            var hasPlaceholder = !p.image && !p.imageUrl;
            productsHtml += '<a href="' + link + '" target="_blank" rel="noopener" class="ir-card">' +
              '<div class="ir-card-img-wrap' + (hasPlaceholder ? ' ir-placeholder' : '') + '"><img src="' + img + '" alt="' + name + '" loading="' + (hasPlaceholder ? 'lazy' : 'eager') + '" class="ir-card-img"></div>' +
              '<div class="ir-card-info"><div class="ir-brand">' + brand + '</div><div class="ir-name">' + name + '</div>' +
              (price ? '<div class="ir-price">' + price + '</div>' : '') +
              '<div class="ir-btn">Commander</div></div></a>';
          });

          var outfitImg = outfit.image || placeholder;
          var outfitHasPlaceholder = !outfit.image;

          container.innerHTML =
            '<header class="ir-header"><a href="/" class="ir-logo">Emmanuelle K</a></header>' +
            '<div class="ir-main">' +
              '<div class="ir-img-col' + (outfitHasPlaceholder ? ' ir-placeholder' : '') + '"><img src="' + outfitImg + '" alt="' + (outfit.title || 'Outfit') + '" class="ir-outfit-img" loading="eager"></div>' +
              '<div class="ir-products-col"><h1 class="ir-title">' + (outfit.title || '') + '</h1><div class="ir-grid">' + productsHtml + '</div></div>' +
            '</div>';

          container.classList.add('active');
          container.classList.add('ir-rendered');
        };

        if (outfitSlug) {
          var cachedOutfit = getCachedData('dw_outfit_' + outfitSlug);
          if (cachedOutfit) {
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', function() { window.__renderOutfitPage(cachedOutfit, false); });
            } else {
              window.__renderOutfitPage(cachedOutfit, false);
            }
          }

          fetch(API_URL + '/outfits/public/' + outfitSlug + '?light=true')
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(d) {
              if (d && d.outfit) {
                window.__renderOutfitPage(d.outfit, true);
                window.__PREFETCHED_OUTFIT__ = d.outfit;

                if (d.outfit.hasBase64Image || d.outfit.products.some(function(p) { return p.hasBase64Image; })) {
                  fetch(API_URL + '/outfits/public/' + outfitSlug)
                    .then(function(r2) { return r2.ok ? r2.json() : null; })
                    .then(function(d2) {
                      if (d2 && d2.outfit) {
                        try { sessionStorage.setItem('dw_outfit_' + outfitSlug, JSON.stringify({ data: d2.outfit, timestamp: Date.now() })); } catch(e) {}
                        window.__PREFETCHED_OUTFIT__ = d2.outfit;
                      }
                    });
                } else {
                  try { sessionStorage.setItem('dw_outfit_' + outfitSlug, JSON.stringify({ data: d.outfit, timestamp: Date.now() })); } catch(e) {}
                }
              }
            })
            .catch(function(e) {
              if (!window.__outfitRendered) {
                fetch(API_URL + '/outfits/public/' + outfitSlug)
                  .then(function(r) { return r.ok ? r.json() : null; })
                  .then(function(d) {
                    if (d && d.outfit) {
                      window.__renderOutfitPage(d.outfit, false);
                      window.__PREFETCHED_OUTFIT__ = d.outfit;
                    }
                  });
              }
            });
        }

        if (!outfitSlug) {
          var cachedOutfits = getCachedData('dw_cache_v2_outfits');
          var cachedProfile = getCachedData('dw_cache_v2_profile');

          if (cachedOutfits) window.__PREFETCHED_OUTFITS__ = Promise.resolve(cachedOutfits);
          if (cachedProfile) window.__PREFETCHED_PROFILE__ = Promise.resolve(cachedProfile);

          if (!cachedOutfits || shouldRefresh('dw_cache_v2_outfits')) {
            var p = fetch(API_URL + '/outfits/export').then(function(r) { return r.ok ? r.json() : null; })
              .then(function(d) {
                if (d) try { sessionStorage.setItem('dw_cache_v2_outfits', JSON.stringify({ data: d, timestamp: Date.now() })); } catch(e) {}
                return d || cachedOutfits;
              })
              .catch(function() { return cachedOutfits; });
            if (!window.__PREFETCHED_OUTFITS__) window.__PREFETCHED_OUTFITS__ = p;
          }

          if (!cachedProfile || shouldRefresh('dw_cache_v2_profile')) {
            var q = fetch(API_URL + '/profile').then(function(r) { return r.ok ? r.json() : null; })
              .then(function(d) { if (d) try { sessionStorage.setItem('dw_cache_v2_profile', JSON.stringify({ data: d, timestamp: Date.now() })); } catch(e) {} return d || cachedProfile; })
              .catch(function() { return cachedProfile; });
            if (!window.__PREFETCHED_PROFILE__) window.__PREFETCHED_PROFILE__ = q;
          }
        }
      })();
    </script>

        if (path.startsWith('/outfits/')) {
          var showSkeleton = function() {
            var skeleton = document.getElementById('outfit-skeleton');
            var loader = document.getElementById('initial-loader');
            if (skeleton && !skeleton.classList.contains('active')) {
              skeleton.classList.add('active');
            }
            if (loader) loader.style.display = 'none';
          };
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', showSkeleton);
          } else {
            showSkeleton();
          }
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.__hideLoader = function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 400);
        }
        var skeleton = document.getElementById('outfit-skeleton');
        if (skeleton) {
          skeleton.style.opacity = '0';
          skeleton.style.transition = 'opacity 0.15s ease';
          setTimeout(function() { if (skeleton.parentNode) skeleton.parentNode.removeChild(skeleton); }, 200);
        }
      };
      document.addEventListener('DOMContentLoaded', function() {
        var path = window.location.pathname;
        if (!path.startsWith('/outfits/')) {
          setTimeout(window.__hideLoader, 2000);
        }
        else {
          setTimeout(window.__hideLoader, 8000);
        }
      });
    </script>
